name: Metrics

on:
  schedule:
    # Sunday 00:07 UTC. Off-the-hour to avoid the cron stampede on GitHub
    # Actions (jobs scheduled at :00 routinely sit in queue 10-30 min).
    - cron: "7 0 * * 0"
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/metrics.yml'

# Prevent concurrent runs (a second push while a run is in flight will cancel
# the in-flight one rather than queueing - metrics are idempotent, so the
# latest config wins).
concurrency:
  group: "metrics"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    # Workflow-wide defaults - applied to every metrics step.
    env:
      METRICS_USER: whitewAw
      METRICS_TZ: Europe/Kyiv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ============================================
      # Preflight: fail fast with a clear message if METRICS_TOKEN is missing.
      # Without this, the metrics action errors deep in its internals with a
      # vague "Bad credentials" message that is hard to diagnose.
      # ============================================
      - name: Verify METRICS_TOKEN secret exists
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::METRICS_TOKEN secret is not configured."
            echo "Create a classic PAT with: read:user, public_repo, read:org"
            echo "(fine-grained PATs do NOT work with lowlighter/metrics — it"
            echo "needs cross-user GraphQL access that fine-grained tokens can't grant)"
            echo "and add it as a repository secret named METRICS_TOKEN."
            exit 1
          fi
          echo "✅ METRICS_TOKEN is configured"

      # ============================================
      # Validate the token can actually authenticate against GitHub.
      # The metrics action errors out with a single confusing line if the
      # token is expired, lacks scopes, or is a fine-grained PAT (which
      # the action does not support); surface that with a useful message.
      # ============================================
      - name: Validate METRICS_TOKEN works
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -e
          status=$(curl -s -o /tmp/who.json -w '%{http_code}' \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)
          if [ "$status" != "200" ]; then
            echo "::error::METRICS_TOKEN failed to authenticate (HTTP $status)."
            echo "  - 401: token expired or revoked — regenerate the PAT"
            echo "  - 403: token lacks scopes — needs read:user, public_repo, read:org"
            echo "  - 404: token belongs to a deleted user"
            cat /tmp/who.json || true
            exit 1
          fi
          login=$(grep -oP '"login":\s*"\K[^"]+' /tmp/who.json | head -1)
          echo "✅ METRICS_TOKEN authenticates as: $login"
          if [ "${login,,}" != "${METRICS_USER,,}" ]; then
            echo "::warning::Token user ($login) differs from METRICS_USER ($METRICS_USER) — metrics may target the wrong account."
          fi
          # Surface granted scopes so failures are easier to diagnose
          scopes=$(curl -sI \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            https://api.github.com/user | grep -i '^x-oauth-scopes:' || true)
          echo "Token scopes: ${scopes:-<none — likely a fine-grained PAT, which is NOT supported>}"

      # ============================================
      # Main Repository Metrics Card
      #
      # Pin every card to v3.34: the upstream v4 branch has no action manifest.
      # Keep the `lowlighter_metrics_` step IDs so the action pulls the official
      # prebuilt image instead of rebuilding the Dockerfile.
      # ============================================
      - name: Generate Main Metrics
        id: lowlighter_metrics_main
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        timeout-minutes: 15
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          output_action: none

          user: ${{ env.METRICS_USER }}
          template: classic
          base: header, activity, community, repositories, metadata

          config_timezone: ${{ env.METRICS_TZ }}
          config_display: large
          config_animations: yes
          config_output: svg

          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30

          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: chartist

          plugin_traffic: yes

          plugin_followup: yes
          plugin_followup_sections: repositories

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_load: 400
          plugin_code_visibility: public
        continue-on-error: true

      # ============================================
      # Repository Activity Metrics
      # ============================================
      - name: Generate Activity Metrics
        id: lowlighter_metrics_activity
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        timeout-minutes: 15
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          output_action: none

          user: ${{ env.METRICS_USER }}
          template: classic
          base: ""
          config_timezone: ${{ env.METRICS_TZ }}
          config_animations: yes
          config_output: svg

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_days: 14
          plugin_reactions_display: absolute
        continue-on-error: true

      # ============================================
      # Language & Technology Stack
      # ============================================
      - name: Generate Technology Stack
        id: lowlighter_metrics_languages
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        timeout-minutes: 15
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          output_action: none

          user: ${{ env.METRICS_USER }}
          template: classic
          base: ""
          config_timezone: ${{ env.METRICS_TZ }}
          config_animations: yes
          config_output: svg

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 10
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 45
          plugin_languages_categories: markup, programming, data
          plugin_languages_colors: github
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 400
        continue-on-error: true

      # ============================================
      # Project Statistics with Traffic
      # ============================================
      - name: Generate Project Stats
        id: lowlighter_metrics_stats
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        timeout-minutes: 15
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-stats.svg
          output_action: none

          user: ${{ env.METRICS_USER }}
          template: classic
          base: ""
          config_timezone: ${{ env.METRICS_TZ }}
          config_animations: yes
          config_output: svg

          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: chartist

          plugin_traffic: yes

          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes
        continue-on-error: true

      # ============================================
      # Achievements & Milestones
      # ============================================
      - name: Generate Achievements
        id: lowlighter_metrics_achievements
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        timeout-minutes: 15
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-achievements.svg
          output_action: none

          user: ${{ env.METRICS_USER }}
          template: classic
          base: ""
          config_timezone: ${{ env.METRICS_TZ }}
          config_animations: yes
          config_output: svg

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_indepth: yes
        continue-on-error: true

      # ============================================
      # Compact Repository Card (for README)
      # ============================================
      - name: Generate Compact Card
        id: lowlighter_metrics_compact
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        timeout-minutes: 15
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-compact.svg
          output_action: none

          user: ${{ env.METRICS_USER }}
          template: repository
          repo: Assessment-of-Ukrainian-financial-statements
          config_timezone: ${{ env.METRICS_TZ }}
          config_animations: yes
          config_output: svg

          base: header, repositories
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_languages: yes
          plugin_languages_limit: 4
          plugin_languages_sections: most-used
          plugin_traffic: yes
        continue-on-error: true

      - name: Upload freshly rendered SVGs
        id: upload_metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: metrics-svgs
          path: /metrics_renders/metrics*.svg
          if-no-files-found: error
          retention-days: 30

      # ============================================
      # Summary - reports per-card outcome (success/failure) so silent
      # `continue-on-error` failures are still visible in the run log.
      # ============================================
      - name: Metrics Generation Summary
        if: always()
        env:
          MAIN_OUTCOME: ${{ steps.lowlighter_metrics_main.outcome }}
          ACTIVITY_OUTCOME: ${{ steps.lowlighter_metrics_activity.outcome }}
          LANGUAGES_OUTCOME: ${{ steps.lowlighter_metrics_languages.outcome }}
          STATS_OUTCOME: ${{ steps.lowlighter_metrics_stats.outcome }}
          ACHIEVEMENTS_OUTCOME: ${{ steps.lowlighter_metrics_achievements.outcome }}
          COMPACT_OUTCOME: ${{ steps.lowlighter_metrics_compact.outcome }}
          ARTIFACT_URL: ${{ steps.upload_metrics.outputs.artifact-url }}
        run: |
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❔" ;;
            esac
          }

          {
            echo "## 📊 Metrics Generation Complete"
            echo ""
            echo "| Metric | File | Outcome |"
            echo "|--------|------|---------|"
            echo "| Main Metrics  | \`metrics.svg\`              | $(icon "$MAIN_OUTCOME") $MAIN_OUTCOME |"
            echo "| Activity      | \`metrics-activity.svg\`     | $(icon "$ACTIVITY_OUTCOME") $ACTIVITY_OUTCOME |"
            echo "| Languages     | \`metrics-languages.svg\`    | $(icon "$LANGUAGES_OUTCOME") $LANGUAGES_OUTCOME |"
            echo "| Stats         | \`metrics-stats.svg\`        | $(icon "$STATS_OUTCOME") $STATS_OUTCOME |"
            echo "| Achievements  | \`metrics-achievements.svg\` | $(icon "$ACHIEVEMENTS_OUTCOME") $ACHIEVEMENTS_OUTCOME |"
            echo "| Compact       | \`metrics-compact.svg\`      | $(icon "$COMPACT_OUTCOME") $COMPACT_OUTCOME |"
            echo ""
            echo "🕒 Summary generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "📦 Fresh renders: [metrics-svgs]($ARTIFACT_URL) (30-day retention)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          for outcome in "$MAIN_OUTCOME" "$ACTIVITY_OUTCOME" "$LANGUAGES_OUTCOME" \
                          "$STATS_OUTCOME" "$ACHIEVEMENTS_OUTCOME" "$COMPACT_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              echo "::error::One or more metrics cards did not render successfully; not publishing a partial set."
              exit 1
            fi
          done

  publish-metrics:
    needs: github-metrics
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download fresh renders
        uses: actions/download-artifact@v8
        with:
          name: metrics-svgs
          path: rendered-metrics

      - name: Verify the complete SVG set
        run: |
          for card in metrics metrics-activity metrics-languages metrics-stats metrics-achievements metrics-compact; do
            file="rendered-metrics/$card.svg"
            if [ ! -s "$file" ] || ! grep -q '<svg[[:space:]>]' "$file"; then
              echo "::error file=$file::Missing or invalid metrics SVG."
              exit 1
            fi
          done

      - name: Publish SVGs to the metrics-output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: metrics-output
          folder: rendered-metrics
          clean: true
          force: false
          commit-message: "Update repository metrics"
