name: Metrics
on:
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday at midnight UTC
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/metrics.yml'

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ============================================
      # Main Repository Metrics Card
      # ============================================
      - name: Generate Main Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          
          # Base configuration
          user: whitewAw
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Display configuration
          config_timezone: Europe/Kiev
          config_display: large
          config_animated: yes
          
          # Plugins
          plugin_lines: yes
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: chartist
          
          plugin_traffic: yes
          plugin_followup: yes
          plugin_followup_sections: repositories
          
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_load: 400
          plugin_code_visibility: public
      
      # ============================================
      # Repository Activity Metrics
      # ============================================
      - name: Generate Activity Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          
          user: whitewAw
          template: classic
          base: ""
          
          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: all
          
          # Contributors
          plugin_contributors: yes
          plugin_contributors_base: contributors
          plugin_contributors_head: main
          plugin_contributors_sections: contributors
          
          # Reactions
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_days: 14
          plugin_reactions_display: absolute
          
      # ============================================
      # Language & Technology Stack
      # ============================================
      - name: Generate Technology Stack
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          
          user: whitewAw
          template: classic
          base: ""
          
          # Detailed language stats
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 12
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 60
          plugin_languages_categories: markup, programming, data
          plugin_languages_colors: github
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 500
          
      # ============================================
      # Project Statistics
      # ============================================
      - name: Generate Project Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-stats.svg
          
          user: whitewAw
          template: classic
          base: ""
          
          # Stars & Forks
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: chartist
          plugin_stargazers_worldmap: yes
          plugin_stargazers_worldmap_token: ${{ secrets.METRICS_TOKEN }}
          
          # Traffic (requires repo permissions)
          plugin_traffic: yes
          
          # Repository size
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes
          
      # ============================================
      # Achievements & Milestones
      # ============================================
      - name: Generate Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-achievements.svg
          
          user: whitewAw
          template: classic
          base: ""
          
          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          
          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_indepth: yes
          
      # ============================================
      # Compact Repository Card (for README)
      # ============================================
      - name: Generate Compact Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-compact.svg
          
          user: whitewAw
          template: repository
          repo: Assessment-of-Ukrainian-financial-statements
          
          # Compact display
          base: header, repositories
          plugin_lines: yes
          plugin_languages: yes
          plugin_languages_limit: 4
          plugin_languages_sections: most-used