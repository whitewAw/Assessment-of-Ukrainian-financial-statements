name: Metrics

on:
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday at midnight UTC
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/metrics.yml'

# Prevent concurrent runs
concurrency:
  group: "metrics"
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      # ============================================
      # Main Repository Metrics Card
      # ============================================
      - name: Generate Main Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          
          # Base configuration
          user: whitewAw
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Display configuration
          config_timezone: Europe/Kyiv
          config_display: large
          config_animations: yes
          config_output: svg
          
          # Plugins
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: chartist
          
          plugin_traffic: yes
          
          plugin_followup: yes
          plugin_followup_sections: repositories
          
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_load: 400
          plugin_code_visibility: public
        continue-on-error: true
      
      # ============================================
      # Repository Activity Metrics
      # ============================================
      - name: Generate Activity Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          
          user: whitewAw
          template: classic
          base: ""
          config_timezone: Europe/Kyiv
          config_output: svg
          
          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes
          
          # Reactions
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_days: 14
          plugin_reactions_display: absolute
        continue-on-error: true
          
      # ============================================
      # Language & Technology Stack
      # ============================================
      - name: Generate Technology Stack
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          
          user: whitewAw
          template: classic
          base: ""
          config_output: svg
          
          # Detailed language stats
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 10
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 45
          plugin_languages_categories: markup, programming, data
          plugin_languages_colors: github
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 400
        continue-on-error: true
          
      # ============================================
      # Project Statistics with Traffic
      # ============================================
      - name: Generate Project Stats
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-stats.svg
          
          user: whitewAw
          template: classic
          base: ""
          config_output: svg
          
          # Stars & Forks
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: chartist
          
          # Traffic (requires repo permissions)
          plugin_traffic: yes
          
          # Repository size
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes
        continue-on-error: true
          
      # ============================================
      # Achievements & Milestones
      # ============================================
      - name: Generate Achievements
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-achievements.svg
          
          user: whitewAw
          template: classic
          base: ""
          config_output: svg
          
          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          
          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_indepth: yes
        continue-on-error: true
          
      # ============================================
      # Compact Repository Card (for README)
      # ============================================
      - name: Generate Compact Card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-compact.svg
          
          user: whitewAw
          template: repository
          repo: Assessment-of-Ukrainian-financial-statements
          config_output: svg
          
          # Compact display
          base: header, repositories
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_languages: yes
          plugin_languages_limit: 4
          plugin_languages_sections: most-used
          plugin_traffic: yes
        continue-on-error: true

      # ============================================
      # Summary
      # ============================================
      - name: Metrics Generation Summary
        if: always()
        run: |
          echo "## 📊 Metrics Generation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | File |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Main Metrics | \`metrics.svg\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Activity | \`metrics-activity.svg\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Languages | \`metrics-languages.svg\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Stats | \`metrics-stats.svg\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Achievements | \`metrics-achievements.svg\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Compact | \`metrics-compact.svg\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕒 Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
