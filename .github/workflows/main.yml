name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Improve AOT build performance
  DOTNET_TC_QuickJitForLoops: 1
  DOTNET_ReadyToRun: 0

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        id: nuget-cache
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET WebAssembly workloads
        run: |
          dotnet workload install wasm-tools wasm-experimental --skip-manifest-update
          echo "✅ Workloads installed successfully"

      - name: Verify workloads
        run: dotnet workload list

      - name: Restore dependencies
        run: dotnet restore AFS/AFS.csproj --locked-mode || dotnet restore AFS/AFS.csproj

      - name: Build and Publish with AOT
        run: |
          dotnet publish AFS/AFS.csproj \
            -c Release \
            -o release \
            --no-restore
        env:
          # Increase memory for AOT compilation
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Update base-tag for GitHub Pages
        run: |
          # Handle both formatted and minified base tags
          sed -i 's|<base href="/" */>|<base href="/Assessment-of-Ukrainian-financial-statements/" />|g' release/wwwroot/index.html
          sed -i 's|<base href="/"/>|<base href="/Assessment-of-Ukrainian-financial-statements/"/>|g' release/wwwroot/index.html
          echo "✅ Base tag updated for GitHub Pages"

      - name: Fix service-worker-assets.js hashes
        working-directory: release/wwwroot
        run: |
          if [ ! -f service-worker-assets.js ]; then
            echo "⚠️ service-worker-assets.js not found, skipping hash fix"
            exit 0
          fi
          
          jsFile=$(<service-worker-assets.js)
          json=$(echo "$jsFile" | sed "s/self.assetsManifest = //g" | sed "s/;//g")
          
          # Validate JSON
          if ! echo "$json" | jq empty 2>/dev/null; then
            echo "⚠️ Invalid JSON in service-worker-assets.js, skipping hash fix"
            exit 0
          fi
          
          assets=$(echo "$json" | jq '.assets[]' -c)
          updated_count=0
          
          for asset in $assets; do
            oldHash=$(echo "$asset" | jq -r '.hash')
            path=$(echo "$asset" | jq -r '.url')
            
            # Skip files that don't need hash updates
            if [[ "$path" == *"index.html"* ]] || [[ ! -f "$path" ]]; then
              continue
            fi
            
            newHash="sha256-$(openssl dgst -sha256 -binary "$path" | openssl base64 -A)"
            
            if [ "$oldHash" != "$newHash" ]; then
              # Escape special characters for sed
              oldHashEscaped=$(printf '%s\n' "$oldHash" | sed 's/[[\.*^$()+?{|]/\\&/g')
              newHashEscaped=$(printf '%s\n' "$newHash" | sed 's/[[\.*^$()+?{|]/\\&/g')
              jsFile=$(echo -n "$jsFile" | sed "s|$oldHashEscaped|$newHashEscaped|g")
              ((updated_count++))
            fi
          done
          
          echo -n "$jsFile" > service-worker-assets.js
          echo "✅ Updated $updated_count asset hashes"

      - name: Prepare SPA routing files
        run: |
          # Keep the custom 404.html if it exists, otherwise copy index.html
          if [ ! -f "release/wwwroot/404.html" ]; then
            cp release/wwwroot/index.html release/wwwroot/404.html
            echo "✅ 404.html created from index.html"
          else
            echo "✅ Using existing custom 404.html"
          fi
          
          # Add .nojekyll to prevent Jekyll processing
          touch release/wwwroot/.nojekyll
          
          echo "✅ SPA routing files ready"

      - name: Update sitemap lastmod dates
        run: |
          if [ -f release/wwwroot/sitemap.xml ]; then
            TODAY=$(date +%Y-%m-%d)
            sed -i "s|<lastmod>.*</lastmod>|<lastmod>$TODAY</lastmod>|g" release/wwwroot/sitemap.xml
            echo "✅ Sitemap updated with date: $TODAY"
          else
            echo "⚠️ sitemap.xml not found, skipping"
          fi

      - name: Create _headers file for CDN compatibility
        run: |
          cat > release/wwwroot/_headers << 'EOF'
          # Security headers for all routes
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
            
          # Framework files - immutable cache
          /_framework/*
            Cache-Control: public, max-age=31536000, immutable
            
          # Static assets - long cache
          /css/*
            Cache-Control: public, max-age=604800
            
          /js/*
            Cache-Control: public, max-age=604800
            
          # WebAssembly files - immutable
          /*.wasm
            Cache-Control: public, max-age=31536000, immutable
            Content-Type: application/wasm
            
          # Service worker - no cache
          /service-worker.js
            Cache-Control: no-cache, no-store, must-revalidate
            
          # HTML files - short cache for updates
          /*.html
            Cache-Control: public, max-age=3600
          EOF
          echo "✅ CDN headers file created"

      - name: Calculate deployment statistics
        id: stats
        run: |
          TOTAL_SIZE=$(du -sh release/wwwroot | cut -f1)
          
          # Calculate total WASM size (sum of all .wasm files)
          if [ -d "release/wwwroot/_framework" ]; then
            WASM_SIZE=$(find release/wwwroot/_framework -name "*.wasm" -exec du -cb {} + | tail -1 | cut -f1 | numfmt --to=iec-i --suffix=B 2>/dev/null || echo "N/A")
            WASM_COUNT=$(find release/wwwroot/_framework -name "*.wasm" | wc -l)
          else
            WASM_SIZE="N/A"
            WASM_COUNT=0
          fi
          
          FILE_COUNT=$(find release/wwwroot -type f | wc -l)
          
          # Use delimiter to handle special characters
          {
            echo "total_size=$TOTAL_SIZE"
            echo "wasm_size=$WASM_SIZE"
            echo "wasm_count=$WASM_COUNT"
            echo "file_count=$FILE_COUNT"
          } >> $GITHUB_OUTPUT
          
          echo "📊 Deployment Statistics:"
          echo "   Total size: $TOTAL_SIZE"
          echo "   WASM size: $WASM_SIZE ($WASM_COUNT files)"
          echo "   File count: $FILE_COUNT"

      - name: Verify deployment files
        run: |
          echo "=== Critical Files Check ==="
          
          MISSING=0
          
          for file in index.html 404.html .nojekyll; do
            if [ -f "release/wwwroot/$file" ]; then
              echo "✅ $file"
            else
              echo "❌ $file MISSING"
              MISSING=$((MISSING + 1))
            fi
          done
          
          # Optional files (warn but don't fail)
          for file in sitemap.xml robots.txt manifest.json; do
            if [ -f "release/wwwroot/$file" ]; then
              echo "✅ $file"
            else
              echo "⚠️ $file (optional)"
            fi
          done
          
          # Check framework files
          if [ -d "release/wwwroot/_framework" ]; then
            FRAMEWORK_FILES=$(find release/wwwroot/_framework -type f | wc -l)
            echo "✅ _framework/ ($FRAMEWORK_FILES files)"
          else
            echo "❌ _framework/ MISSING"
            MISSING=$((MISSING + 1))
          fi
          
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING critical files are missing!"
            exit 1
          fi
          
          echo ""
          echo "=== Deployment Ready ==="

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: release/wwwroot
          clean: true
          single-commit: true
          commit-message: "Deploy: ${{ github.sha }} - Size: ${{ steps.stats.outputs.total_size }}"

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Size | ${{ steps.stats.outputs.total_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WASM Size | ${{ steps.stats.outputs.wasm_size }} (${{ steps.stats.outputs.wasm_count }} files) |" >> $GITHUB_STEP_SUMMARY
          echo "| File Count | ${{ steps.stats.outputs.file_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Live URL:** https://whitewaw.github.io/Assessment-of-Ukrainian-financial-statements/" >> $GITHUB_STEP_SUMMARY
