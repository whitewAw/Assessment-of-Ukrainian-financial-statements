name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Improve AOT build performance
  DOTNET_TC_QuickJitForLoops: 1
  DOTNET_ReadyToRun: 0
  # Use Node.js 24 for GitHub Actions (Node.js 20 deprecated June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Cache NuGet packages and .NET workloads
        uses: actions/cache@v4
        id: nuget-cache
        with:
          # ~/.nuget/packages      - package cache
          # ~/.dotnet/sdk-manifests - workload manifests
          # ~/.dotnet/packs         - installed workload packs (wasm-tools ~200 MB)
          # Caching the workload paths turns `dotnet workload install wasm-tools`
          # from a 30-60 s download into a no-op on warm runs.
          path: |
            ~/.nuget/packages
            ~/.dotnet/sdk-manifests
            ~/.dotnet/packs
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-
            ${{ runner.os }}-nuget-

      - name: Install .NET WebAssembly workloads
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          echo "✅ Workloads installed successfully"

      - name: Verify workloads
        run: dotnet workload list

      - name: Restore dependencies
        run: dotnet restore AFS/AFS.csproj --locked-mode || dotnet restore AFS/AFS.csproj

      - name: Build and Publish with AOT
        run: |
          dotnet publish AFS/AFS.csproj \
            -c Release \
            -o release \
            --no-restore
        env:
          # Increase memory for AOT compilation
          NODE_OPTIONS: --max_old_space_size=4096

      # Snapshot the pristine build (with <base href="/" />) BEFORE the
      # GH-Pages-specific sed rewrite below. Netlify pulls from this snapshot
      # so it gets a build with the correct base path for the apex domain.
      # See the "Deploy to Netlify" step at the end of this workflow.
      - name: Snapshot build for Netlify
        run: |
          # `cp -al` = archive + hardlinks. Creates release-netlify/ as a
          # hardlink mirror of release/ in O(file-count) without copying the
          # ~60 MB of AOT output. The subsequent sed invocations against
          # release/wwwroot/index.html rewrite the file (new inode), which
          # safely breaks the link for that one file only — the netlify
          # snapshot keeps the original content.
          cp -al release release-netlify
          echo "✅ Pristine build snapshot taken (release-netlify/, hardlinked) before base-tag rewrite"

      - name: Update base-tag for GitHub Pages
        run: |
          # Handle both formatted and minified base tags
          sed -i 's|<base href="/" */>|<base href="/Assessment-of-Ukrainian-financial-statements/" />|g' release/wwwroot/index.html
          sed -i 's|<base href="/"/>|<base href="/Assessment-of-Ukrainian-financial-statements/"/>|g' release/wwwroot/index.html
          echo "✅ Base tag updated for GitHub Pages"

      - name: Mark GH Pages mirror as noindex
        # GH Pages serves the same content as Netlify. Even with a Netlify
        # canonical, Google still wastes crawl budget on whitewaw.github.io
        # and lists every page as "Alternate page with proper canonical tag"
        # in Search Console — visual noise that hides real issues.
        # Promoting the existing `index, follow,...` robots meta to
        # `noindex, follow` on the mirror keeps the canonical signal intact
        # (Google still follows links to discover content) while removing
        # the mirror URLs from the index entirely. Runs BEFORE the SPA
        # routing step so the 404.html copy inherits noindex automatically.
        run: |
          sed -i 's|<meta name="robots" content="index, follow[^"]*"|<meta name="robots" content="noindex, follow"|g' release/wwwroot/index.html
          echo "✅ Marked release/wwwroot/index.html as noindex (GH Pages mirror)"

      - name: Prepare SPA routing files
        run: |
          # Keep the custom 404.html if it exists, otherwise copy index.html
          if [ ! -f "release/wwwroot/404.html" ]; then
            cp release/wwwroot/index.html release/wwwroot/404.html
            echo "✅ 404.html created from index.html (GH Pages)"
          else
            echo "✅ Using existing custom 404.html (GH Pages)"
          fi

          # Add .nojekyll to prevent Jekyll processing
          touch release/wwwroot/.nojekyll

          # Netlify snapshot: 404.html must exist so deep-linked routes work
          if [ ! -f "release-netlify/wwwroot/404.html" ]; then
            cp release-netlify/wwwroot/index.html release-netlify/wwwroot/404.html
            echo "✅ 404.html created from index.html (Netlify)"
          else
            echo "✅ Using existing custom 404.html (Netlify)"
          fi

          echo "✅ SPA routing files ready"

      - name: Setup Node.js for prerendering
        uses: actions/setup-node@v4
        with:
          # Node 22 is the current LTS (Node 20 reaches EOL April 2026).
          node-version: '22'

      - name: Install prerender dependencies
        working-directory: tools/prerender
        run: npm install --no-audit --no-fund --no-progress

      - name: Generate Open Graph image (1200x630)
        # Renders a real 1.91:1 OG/Twitter card via headless Chromium and
        # writes it into both deploy snapshots. Twitter/LinkedIn/Slack/Discord
        # render <meta property="og:image"> at 1200x630 — the previous
        # icon-512.png (square) produced a tiny thumbnail and triggered
        # "Image not large enough" in Search Console Discover audits.
        continue-on-error: true
        run: |
          node tools/prerender/generate-og-image.mjs release/wwwroot/og-image.png
          node tools/prerender/generate-og-image.mjs release-netlify/wwwroot/og-image.png
          echo "✅ og-image.png (1200x630) written to both snapshots"

      - name: Prerender routes (Bing/Yandex/AI-bot SEO)
        # Renders each route in headless Chromium and writes static <route>/index.html
        # snapshots so non-JS crawlers see real content instead of the loading spinner.
        # Failures of individual routes do NOT fail the build.
        continue-on-error: true
        run: |
          node tools/prerender/prerender.mjs release/wwwroot \
            --baseHref=/Assessment-of-Ukrainian-financial-statements/ \
            --origin=https://ua-finance.netlify.app
          echo "✅ Prerender step finished (GH Pages)"

      - name: Prerender routes for Netlify snapshot
        # Same prerender pass on the Netlify snapshot so ua-finance.netlify.app
        # also serves real content to crawlers. Canonical origin is Netlify itself.
        continue-on-error: true
        run: |
          node tools/prerender/prerender.mjs release-netlify/wwwroot \
            --baseHref=/ \
            --origin=https://ua-finance.netlify.app
          echo "✅ Prerender step finished (Netlify)"

      - name: Update sitemap lastmod dates
        run: |
          TODAY=$(date +%Y-%m-%d)
          for sitemap in release/wwwroot/sitemap.xml release-netlify/wwwroot/sitemap.xml; do
            if [ -f "$sitemap" ]; then
              sed -i "s|<lastmod>.*</lastmod>|<lastmod>$TODAY</lastmod>|g" "$sitemap"
              echo "✅ Sitemap updated with date: $TODAY ($sitemap)"
            else
              echo "⚠️ $sitemap not found, skipping"
            fi
          done

      - name: Rewrite GH Pages sitemap & robots to use GH Pages host
        # The committed sitemap.xml/robots.txt use the Netlify canonical host
        # (https://ua-finance.netlify.app/). The Netlify deploy keeps them as-is,
        # but the GH Pages mirror needs its own host so Search Console / Bing can
        # verify it. <link rel="canonical"> in every page still points to Netlify,
        # so ranking signal is consolidated regardless.
        run: |
          GH_BASE="https://whitewaw.github.io/Assessment-of-Ukrainian-financial-statements"
          NL_BASE="https://ua-finance.netlify.app"
          for f in release/wwwroot/sitemap.xml release/wwwroot/robots.txt; do
            if [ -f "$f" ]; then
              before=$(grep -c "$NL_BASE" "$f" || true)
              # Use a delimiter that does not appear in URLs to keep sed safe
              sed -i "s|$NL_BASE|$GH_BASE|g" "$f"
              after=$(grep -c "$NL_BASE" "$f" || true)
              echo "✅ Rewrote $f: $before -> $after Netlify references remaining"
            else
              echo "⚠️ $f not found, skipping"
            fi
          done

      - name: Create _headers file for CDN compatibility
        # _headers is a Netlify/Cloudflare Pages convention. GitHub Pages ignores it,
        # so we still write it to both outputs (harmless on GH Pages, required on Netlify).
        # The heredoc body is YAML-indented; we strip a fixed prefix with sed so the
        # final file has path lines starting at column 1 (Netlify requires this).
        run: |
          for wwwroot in release/wwwroot release-netlify/wwwroot; do
            [ -d "$wwwroot" ] || continue
            sed 's/^          //' > "$wwwroot/_headers" <<'EOF'
          # Security headers for all routes
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()

          # Framework files - immutable cache.
          # NOTE: We deliberately do NOT set Content-Encoding here.
          # Netlify auto-negotiates Brotli/gzip for compressible MIME types.
          # Forcing Content-Encoding: br on raw (uncompressed) files causes
          # ERR_CONTENT_DECODING_FAILED in the browser.
          /_framework/*
            Cache-Control: public, max-age=31536000, immutable

          # Static assets - long cache
          /css/*
            Cache-Control: public, max-age=604800

          /js/*
            Cache-Control: public, max-age=604800

          # WebAssembly files - immutable cache + correct MIME type
          /*.wasm
            Cache-Control: public, max-age=31536000, immutable
            Content-Type: application/wasm

          # Service worker - no cache (must always check for updates)
          /service-worker.js
            Cache-Control: no-cache, no-store, must-revalidate

          # HTML files - short cache for updates
          /*.html
            Cache-Control: public, max-age=3600
          EOF
            echo "✅ _headers written to $wwwroot"
          done

      - name: Fix service-worker-assets.js hashes
        run: |
          for wwwroot in release/wwwroot release-netlify/wwwroot; do
            if [ ! -f "$wwwroot/service-worker-assets.js" ]; then
              echo "⚠️ $wwwroot/service-worker-assets.js not found, skipping hash fix"
              continue
            fi

            pushd "$wwwroot" >/dev/null
            jsFile=$(<service-worker-assets.js)
            json=$(echo "$jsFile" | sed "s/self.assetsManifest = //g" | sed "s/;//g")

            if ! echo "$json" | jq empty 2>/dev/null; then
              echo "⚠️ Invalid JSON in $wwwroot/service-worker-assets.js, skipping hash fix"
              popd >/dev/null
              continue
            fi

            assets=$(echo "$json" | jq '.assets[]' -c)
            updated_count=0
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              oldHash=$(echo "$asset" | jq -r '.hash')
              path=$(echo "$asset" | jq -r '.url')

              if [[ "$path" == *"index.html"* ]] || [[ ! -f "$path" ]]; then
                continue
              fi

              newHash="sha256-$(openssl dgst -sha256 -binary "$path" | openssl base64 -A)"

              if [ "$oldHash" != "$newHash" ]; then
                oldHashEscaped=$(printf '%s\n' "$oldHash" | sed 's/[[\.*^$()+?{|]/\\&/g')
                newHashEscaped=$(printf '%s\n' "$newHash" | sed 's/[[\.*^$()+?{|]/\\&/g')
                jsFile=$(echo -n "$jsFile" | sed "s|$oldHashEscaped|$newHashEscaped|g")
                ((++updated_count))
              fi
            done <<< "$assets"

            echo -n "$jsFile" > service-worker-assets.js
            popd >/dev/null
            echo "✅ Updated $updated_count asset hashes in $wwwroot"
          done

      - name: Calculate deployment statistics
        id: stats
        run: |
          # GH Pages output
          TOTAL_SIZE=$(du -sh release/wwwroot | cut -f1)
          if [ -d "release/wwwroot/_framework" ]; then
            WASM_SIZE=$(find release/wwwroot/_framework -name "*.wasm" -exec du -cb {} + | tail -1 | cut -f1 | numfmt --to=iec-i --suffix=B 2>/dev/null || echo "N/A")
            WASM_COUNT=$(find release/wwwroot/_framework -name "*.wasm" | wc -l)
          else
            WASM_SIZE="N/A"
            WASM_COUNT=0
          fi
          FILE_COUNT=$(find release/wwwroot -type f | wc -l)

          # Netlify output
          if [ -d "release-netlify/wwwroot" ]; then
            NETLIFY_TOTAL_SIZE=$(du -sh release-netlify/wwwroot | cut -f1)
            NETLIFY_FILE_COUNT=$(find release-netlify/wwwroot -type f | wc -l)
          else
            NETLIFY_TOTAL_SIZE="N/A"
            NETLIFY_FILE_COUNT=0
          fi

          {
            echo "total_size=$TOTAL_SIZE"
            echo "wasm_size=$WASM_SIZE"
            echo "wasm_count=$WASM_COUNT"
            echo "file_count=$FILE_COUNT"
            echo "netlify_total_size=$NETLIFY_TOTAL_SIZE"
            echo "netlify_file_count=$NETLIFY_FILE_COUNT"
          } >> $GITHUB_OUTPUT

          echo "📊 Deployment Statistics:"
          echo "   GH Pages — total: $TOTAL_SIZE, files: $FILE_COUNT, wasm: $WASM_SIZE ($WASM_COUNT)"
          echo "   Netlify  — total: $NETLIFY_TOTAL_SIZE, files: $NETLIFY_FILE_COUNT"

      - name: Verify deployment files
        run: |
          MISSING=0
          # GH Pages requires .nojekyll; Netlify does not — keep it per-output.
          for wwwroot in release/wwwroot release-netlify/wwwroot; do
            label="GH Pages"
            required="index.html 404.html .nojekyll"
            if [ "$wwwroot" = "release-netlify/wwwroot" ]; then
              label="Netlify"
              required="index.html 404.html"
            fi
            echo "=== Critical Files Check ($label) ==="
            if [ ! -d "$wwwroot" ]; then
              echo "::error::$wwwroot directory missing"
              MISSING=$((MISSING + 1))
              continue
            fi
            for file in $required; do
              if [ -f "$wwwroot/$file" ]; then
                echo "✅ $file"
              else
                echo "❌ $file MISSING"
                MISSING=$((MISSING + 1))
              fi
            done
            for file in sitemap.xml robots.txt manifest.json favicon.ico; do
              if [ -f "$wwwroot/$file" ]; then
                echo "✅ $file"
              else
                echo "⚠️ $file (optional)"
              fi
            done
            if [ -d "$wwwroot/_framework" ]; then
              FRAMEWORK_FILES=$(find "$wwwroot/_framework" -type f | wc -l)
              echo "✅ _framework/ ($FRAMEWORK_FILES files)"
            else
              echo "❌ _framework/ MISSING"
              MISSING=$((MISSING + 1))
            fi
            echo ""
          done

          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING critical files are missing!"
            exit 1
          fi
          echo "=== Deployment Ready ==="

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: release/wwwroot
          clean: true
          single-commit: true
          commit-message: "Deploy: ${{ github.sha }} - Size: ${{ steps.stats.outputs.total_size }}"

      # Push the pristine (no base-tag rewrite) snapshot to a dedicated branch
      # so Netlify can serve it from ua-finance.netlify.app with the correct
      # <base href="/" />.
      #
      # ONE-TIME NETLIFY SETUP (do this in the Netlify dashboard):
      #   Site settings → Build & deploy → Continuous deployment → Branch
      #   change "Production branch" from `gh-pages` to `netlify-deploy`.
      - name: Deploy to Netlify branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: netlify-deploy
          folder: release-netlify/wwwroot
          clean: true
          single-commit: true
          commit-message: "Netlify: ${{ github.sha }} - Size: ${{ steps.stats.outputs.total_size }}"

      - name: Deployment Summary
        run: |
          {
            echo "## 🚀 Deployment Complete"
            echo ""
            echo "| Metric | GH Pages | Netlify (canonical) |"
            echo "|--------|----------|---------------------|"
            echo "| Total Size | ${{ steps.stats.outputs.total_size }} | ${{ steps.stats.outputs.netlify_total_size }} |"
            echo "| File Count | ${{ steps.stats.outputs.file_count }} | ${{ steps.stats.outputs.netlify_file_count }} |"
            echo "| WASM | ${{ steps.stats.outputs.wasm_size }} (${{ steps.stats.outputs.wasm_count }} files) | — |"
            echo "| Commit | \`${{ github.sha }}\` | \`${{ github.sha }}\` |"
            echo ""
            echo "🌐 **Canonical:** https://ua-finance.netlify.app/"
            echo "🌐 **Mirror:** https://whitewaw.github.io/Assessment-of-Ukrainian-financial-statements/"
          } >> "$GITHUB_STEP_SUMMARY"
