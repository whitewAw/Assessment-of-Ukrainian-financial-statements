<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="robots" content="noindex, follow"/>
    <title>Page Not Found | UFIN</title>
    <script>
        // Keep the SPA fallback only on the GitHub Pages mirror.
        (function() {
            if (location.hostname.toLowerCase() !== 'whitewaw.github.io') return;

            var basePath = '/Assessment-of-Ukrainian-financial-statements/';
            var pathname = location.pathname;
            if (pathname.indexOf(basePath) !== 0 && pathname !== basePath.slice(0, -1)) {
                pathname = basePath + pathname.replace(/^\//, '');
            }
            var fullPath = pathname + location.search + location.hash;
            if (fullPath !== basePath) {
                sessionStorage.setItem('ufin-redirect-path', fullPath);
            }
            location.replace(basePath);
        })();
    </script>
    <style>body{font-family:system-ui;display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;box-sizing:border-box;background:#f0f0f0}main{text-align:center}</style>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p>The requested page does not exist or has moved.</p>
        <p><a href="https://ua-finance.netlify.app/">Go to the UFIN homepage</a></p>
    </main>
</body>
</html>
