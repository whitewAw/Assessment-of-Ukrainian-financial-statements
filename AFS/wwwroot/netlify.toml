# Netlify config for UFIN - Optimized for AOT/WASM
# https://ua-finance.netlify.app

[build]
  publish = "."

# Redirects

# Collapse language-query duplicates to the canonical homepage.
# The app still supports language changes via LocalStorage at runtime, but
# ?lang=* URLs are not separate static pages and should not appear in Google.
[[redirects]]
  from = "/"
  query = { lang = ":lang" }
  to = "/"
  status = 301
  force = true

# Canonicalize extensionless app routes without a trailing slash.
# Without this, static prerender snapshots at /route/index.html make Netlify
# also serve /route/, which Google reports as a duplicate "page version with
# canonical tag". The no-slash URLs are the sitemap and canonical URLs.
[[redirects]]
  from = "/aiassistant/"
  to = "/aiassistant"
  status = 301
  force = true

