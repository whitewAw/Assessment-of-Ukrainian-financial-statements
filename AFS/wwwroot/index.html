    <script>
        (function () {
            const messages = ['Initializing', 'Loading runtime', 'Loading components', 'Almost ready'];
            let index = 0;
            const progressEl = document.getElementById('load-progress');

            if (progressEl) {
                const interval = setInterval(() => {
                    index = (index + 1) % messages.length;
                    progressEl.textContent = messages[index];
                }, 800);

                window.addEventListener('ufin:loaded', () => clearInterval(interval));
            }
        })();
